name: Build and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  # Permette di rilanciare il deploy a mano dalla tab Actions.
  workflow_dispatch:

# Un solo deploy alla volta; un deploy in corso non viene interrotto da uno nuovo.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite legge .env.production (VITE_OAUTH_BASE_URL) e genera la cartella dist/
      # indicata come "public" in firebase.json.
      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: spotifymigrationtool-d722b
          channelId: live
